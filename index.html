<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life: Your Story — 2D</title>
<style>
:root{--bg:#0e2230;--pn:#16384c;--ac:#ffb62e;--tx:#f2f6f8;--mu:#9fb7c4;--ok:#5fd08a;--no:#ff7a6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:none;justify-content:space-between;align-items:center;padding:10px 12px;pointer-events:none}
#hud>*{pointer-events:auto}
.chip{background:#0e2230cc;border-radius:12px;padding:8px 12px;font-size:14px}
.bar{display:block;width:90px;height:6px;background:#ffffff33;border-radius:3px;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
#phoneBtn,#menuBtn{background:var(--ac);color:#1a1200;border:0;border-radius:12px;padding:10px 16px;font-weight:700}
#rain{position:fixed;inset:0;pointer-events:none;display:none;background:repeating-linear-gradient(105deg,transparent 0 7px,#d6ebffaa 7px 8px);background-size:60px 90px;animation:rn .35s linear infinite}
@keyframes rn{to{background-position:-30px 90px}}
#bub{position:fixed;inset:0;pointer-events:none;z-index:3}
#bub .b{position:fixed;transform:translate(-50%,-100%);background:#fff;color:#102030;border-radius:12px;padding:5px 9px;font-size:13px;line-height:1.25;max-width:170px;text-align:center;box-shadow:0 2px 6px #0006}
.sp{background:#fff;color:#102030;border-radius:14px;padding:10px 12px;margin:10px 0}
.you{background:#ffffff1f;border-radius:14px;padding:8px 12px;margin:10px 0 0;font-size:14px}
#c{image-rendering:pixelated;image-rendering:crisp-edges}
#look{display:none!important}
#joy{position:fixed;left:22px;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff44;display:none;touch-action:none}
#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#ffffffaa}
#act{position:fixed;right:20px;bottom:calc(40px + env(safe-area-inset-bottom,0px));display:none;background:var(--ac);color:#1a1200;border:0;border-radius:16px;padding:16px 20px;font-weight:700;font-size:17px;max-width:55%;z-index:5}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#000b;padding:10px 16px;border-radius:12px;display:none;z-index:20;max-width:90%;text-align:center}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:10;padding:14px;touch-action:pan-y}
#mb{background:var(--pn);border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:88%;overflow-y:auto;user-select:text;-webkit-user-select:text}
h2,h3{margin:0 0 8px}h2{font-size:24px}h3{font-size:19px}
p{margin:6px 0}.m{color:var(--mu);font-size:14px}
.o{display:block;width:100%;text-align:left;background:#ffffff14;border:1px solid #ffffff2a;border-radius:12px;padding:13px;margin:8px 0}
.o.go{background:var(--ac);color:#1a1200;font-weight:700;text-align:center;border:0}
.o.ok{background:#5fd08a33;border-color:var(--ok)}.o.no{background:#ff7a6b33;border-color:var(--no)}
input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid #ffffff44;background:#0e2230;color:var(--tx);font-size:17px;user-select:text;-webkit-user-select:text}
.sw{display:inline-block;width:42px;height:42px;border-radius:50%;margin:4px 6px 4px 0;border:3px solid transparent}
.sw.on{border-color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:4px 0;vertical-align:top}td:first-child{color:var(--mu);width:42%}
.big{font-size:44px;font-weight:800;color:var(--ac);line-height:1}
</style></head><body>
<canvas id="c"></canvas>
<div id="bub"></div><div id="rain"></div><div id="hud"><div class="chip"><b id="hn"></b> <span id="hc" class="m"></span><span class="bar"><i id="he"></i></span><span id="nd" class="m" style="display:block;font-size:12px;margin-top:4px"></span></div><span><button id="phoneBtn" onclick="phone()">📱</button> <button id="menuBtn" onclick="menu()">Menu</button></span></div>
<div id="hint" class="chip" style="position:fixed;left:12px;right:12px;top:calc(64px + env(safe-area-inset-top,0px));display:none;text-align:center;pointer-events:none"></div><div id="look"></div><div id="joy"><div id="knob"></div></div>
<button id="act"></button><div id="toast"></div>
<div id="modal"><div id="mb"></div></div>
<script>
window.__lysLog=[];
function __log(m,err){window.__lysLog.push(m);if(err)console.error(m);else console.log(m);}
function __loadSrc(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=src;
    s.onload=()=>{__log('OK '+src);res()};
    s.onerror=()=>{__log('FAIL '+src,1);rej(new Error('Failed '+src))};
    document.body.appendChild(s);
  });
}
function __inject(code,name){
  const s=document.createElement('script');
  s.textContent=code+'\n//# sourceURL='+(name||'inject')+'.js';
  document.body.appendChild(s);
}
async function __loadB64(name,n,bridgeCode){
  __log('Loading '+name+'…');
  let b='';
  for(let i=0;i<n;i++){
    const r=await fetch(name+'.p'+i+'.txt');
    if(!r.ok) throw new Error(name+'.p'+i+' HTTP '+r.status);
    b+=await r.text();
  }
  let code;
  try{ code=atob(b); }catch(e){ throw new Error(name+' bad base64'); }
  if(bridgeCode) code+=bridgeCode;
  __inject(code,name);
  __log('OK '+name+' ('+code.length+')');
}
(async()=>{
  try{
    await __loadSrc('renderer-2d.js');
    try{ if(typeof THREE!=='undefined') window.THREE=THREE; }catch(e){}
    await __loadSrc('s1.js');
    await __loadSrc('s2.js');
    await __loadSrc('s3.js');
    await __loadSrc('s4.js');
    await __loadB64('s5',8,';try{window.WX=WX}catch(e){}try{window.SHOWS=SHOWS}catch(e){}try{window.MEALS=MEALS}catch(e){}try{window.ACT=ACT}catch(e){}try{window.raining=raining}catch(e){}try{window.rainyDay=rainyDay}catch(e){}try{window.YEAR=YEAR}catch(e){}try{window.age=age}catch(e){}try{window.birthday=birthday}catch(e){}try{window.nstat=nstat}catch(e){}try{window.phone=phone}catch(e){}try{window.goHome=goHome}catch(e){}try{window.pContacts=pContacts}catch(e){}try{window.pContact=pContact}catch(e){}try{window.pText=pText}catch(e){}try{window.pMap=pMap}catch(e){}try{window.pFood=pFood}catch(e){}try{window.order=order}catch(e){}try{window.busMenu=busMenu}catch(e){}try{window.ride=ride}catch(e){}try{window.tvMenu=tvMenu}catch(e){}try{window.startTV=startTV}catch(e){}');
    await __loadSrc('s6.js');
    await __loadSrc('s7.js');
    await __loadSrc('s8.js');
    await __loadB64('s9',8,';try{window.NP=NP}catch(e){}try{window.PI=PI}catch(e){}try{window.TOP=TOP}catch(e){}try{window.FL=FL}catch(e){}try{window.rel=rel}catch(e){}try{window.hx=hx}catch(e){}try{window.YOU=YOU}catch(e){}try{window.LINES=LINES}catch(e){}try{window.INTRO=INTRO}catch(e){}try{window.LIKE=LIKE}catch(e){}try{window.DIS=DIS}catch(e){}try{window.ADV=ADV}catch(e){}try{window.talk=talk}catch(e){}try{window.topic=topic}catch(e){}try{window.mkN=mkN}catch(e){}try{window.CROWD=CROWD}catch(e){}try{window.CULLED=CULLED}catch(e){}try{window.RXS=RXS}catch(e){}try{window.RZS=RZS}catch(e){}try{window.SPECIAL=SPECIAL}catch(e){}try{window.EXPL=EXPL}catch(e){}');
    await __loadB64('s10',8,';try{window.BUB=BUB}catch(e){}try{window.camT=camT}catch(e){}try{window.mvSp=mvSp}catch(e){}try{window.say=say}catch(e){}try{window.toScreen=toScreen}catch(e){}try{window.updateBubbles=updateBubbles}catch(e){}try{window.GREET=GREET}catch(e){}try{window.NCH=NCH}catch(e){}try{window.NRE=NRE}catch(e){}try{window.PAIRS=PAIRS}catch(e){}try{window.FIRSTN=FIRSTN}catch(e){}try{window.SURN=SURN}catch(e){}try{window.PERS5=PERS5}catch(e){}try{window.CLR=CLR}catch(e){}try{window.HAIRC=HAIRC}catch(e){}try{window.SKINC=SKINC}catch(e){}try{window.STYL=STYL}catch(e){}try{window.chatter=chatter}catch(e){}try{window.TXT=TXT}catch(e){}try{window.texting=texting}catch(e){}try{window.pMsgs=pMsgs}catch(e){}try{window.pMsg=pMsg}catch(e){}try{window.reply=reply}catch(e){}try{window.visitDoor=visitDoor}catch(e){}try{window.leaveVisit=leaveVisit}catch(e){}try{window.shared=shared}catch(e){}try{window.A_V=A_V}catch(e){}');
    await __loadSrc('s11.js');
    await __loadB64('s12',7,';try{window.R=R}catch(e){}try{window.sc=sc}catch(e){}try{window.cam=cam}catch(e){}try{window.hemi=hemi}catch(e){}try{window.sun=sun}catch(e){}try{window.OUT=OUT}catch(e){}try{window.INN=INN}catch(e){}try{window.GEO=GEO}catch(e){}try{window.MAT=MAT}catch(e){}try{window.mt=mt}catch(e){}try{window.gm=gm}catch(e){}try{window.box=box}catch(e){}try{window.cyl=cyl}catch(e){}try{window.person=person}catch(e){}try{window.anim=anim}catch(e){}try{window.outRects=outRects}catch(e){}try{window.inRects=inRects}catch(e){}try{window.acts=acts}catch(e){}try{window.movers=movers}catch(e){}try{window.WM=WM}catch(e){}try{window.wn=wn}catch(e){}try{window.HC=HC}catch(e){}try{window.DIST=DIST}catch(e){}try{window.areaOf=areaOf}catch(e){}try{window.addr=addr}catch(e){}try{window.house=house}catch(e){}try{window.HP=HP}catch(e){}');
    await __loadB64('s13',7,';try{window.mk2=mk2}catch(e){}try{window.marker=marker}catch(e){}try{window.car=car}catch(e){}try{window.HFL=HFL}catch(e){}try{window.HW=HW}catch(e){}try{window.INN2=INN2}catch(e){}try{window.hostG=hostG}catch(e){}try{window.P=P}catch(e){}try{window.buildHost=buildHost}catch(e){}try{window.buildPlayer=buildPlayer}catch(e){}try{window.setScene=setScene}catch(e){}try{window.enterHome=enterHome}catch(e){}try{window.leaveHome=leaveHome}catch(e){}try{window.A_OUT=A_OUT}catch(e){}try{window.A_IN=A_IN}catch(e){}');
    await __loadB64('s14',8,';try{window.SKYC=SKYC}catch(e){}try{window.NIGHTC=NIGHTC}catch(e){}try{window.DAYC=DAYC}catch(e){}try{window.GREYC=GREYC}catch(e){}try{window.jx=jx}catch(e){}try{window.jy=jy}catch(e){}try{window.yaw=yaw}catch(e){}try{window.lookId=lookId}catch(e){}try{window.lx=lx}catch(e){}try{window.keys=keys}catch(e){}try{window.near=near}catch(e){}try{window.blocked=blocked}catch(e){}try{window.resize=resize}catch(e){}try{window.last=last}catch(e){}try{window.saveT=saveT}catch(e){}try{window.update=update}catch(e){}try{window.loop=loop}catch(e){}');
    await __loadSrc('s15.js');
    await __loadSrc('screen-2d.js');
    setTimeout(()=>{
      const m=document.getElementById('modal');
      if(m && getComputedStyle(m).display==='none' && typeof newLifeScreen==='function'){
        try{ newLifeScreen(); }catch(e){ console.error(e); alert('Start error: '+e.message); }
      }
      if(typeof newLifeScreen!=='function'){
        alert('Game failed to start. Log: '+window.__lysLog.join(' | '));
      }
    },100);
  }catch(e){
    console.error(e);
    const m=document.getElementById('modal');
    const mb=document.getElementById('mb');
    if(m&&mb){
      m.style.display='flex';
      mb.innerHTML='<h2>Load error</h2><p style="color:#ff7a6b">'+e.message+'</p><p style="color:#9fb7c4;font-size:13px">'+window.__lysLog.join('<br>')+'</p>';
    } else alert('Load error: '+e.message+'\n'+window.__lysLog.join('\n'));
  }
})();
</script>
</body></html>
