<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life: Your Story — Neighbourhoods</title>
<style>
:root{--bg:#0b1a24;--pn:#142b3a;--ac:#ffb62e;--tx:#f2f6f8;--mu:#9fb7c4;--ok:#5fd08a;--no:#ff7a6b;--card:#0e2230ee;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
#hud{position:fixed;left:0;right:0;top:var(--safe-t);display:none;justify-content:space-between;align-items:flex-start;padding:10px 12px;pointer-events:none;z-index:6;gap:10px}
#hud>*{pointer-events:auto}
.chip{background:var(--card);backdrop-filter:blur(10px);border:1px solid #ffffff18;border-radius:16px;padding:10px 12px;font-size:13px;box-shadow:0 4px 16px #0005}
#hud .chip{min-width:0;flex:1;max-width:62%}
#hn{font-size:15px;font-weight:700}
#hc{display:block;margin-top:2px;color:var(--mu);font-size:12px}
.bar{display:block;width:100%;max-width:120px;height:7px;background:#ffffff22;border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb62e,#ffd56a);border-radius:4px}
#nd{display:block;font-size:11px;margin-top:6px;color:var(--mu);line-height:1.35}
.hud-btns{display:flex;gap:8px;flex:none}
.hud-btns button{width:48px;height:48px;border:0;border-radius:14px;background:var(--ac);color:#1a1200;font-weight:800;font-size:20px;box-shadow:0 4px 14px #0005;display:flex;align-items:center;justify-content:center}
#hint{position:fixed;left:12px;right:12px;top:calc(72px + var(--safe-t));display:none;text-align:center;pointer-events:none;z-index:5;background:var(--card);border:1px solid #ffffff14;border-radius:12px;padding:8px 12px;font-size:13px;color:var(--mu)}
#joy{position:fixed;left:18px;bottom:calc(24px + var(--safe-b));width:118px;height:118px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffffff28,#ffffff10);border:2px solid #ffffff33;display:none;touch-action:none;z-index:5}
#knob{position:absolute;left:39px;top:39px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d0d8e0);box-shadow:0 2px 8px #0005}
#look{position:fixed;right:0;top:80px;bottom:0;width:50%;display:none;touch-action:none}
#act{position:fixed;right:16px;bottom:calc(36px + var(--safe-b));display:none;z-index:6;background:linear-gradient(180deg,#ffd056,#ffb62e);color:#1a1200;border:0;border-radius:18px;padding:16px 22px;font-weight:800;font-size:16px;max-width:58%;min-width:120px;box-shadow:0 6px 20px #0006}
#toast{position:fixed;left:50%;top:calc(78px + var(--safe-t));transform:translateX(-50%);background:#0a1520f2;border:1px solid #ffffff22;padding:12px 18px;border-radius:14px;display:none;z-index:20;max-width:90%;text-align:center;font-size:14px;font-weight:600}
#rain{position:fixed;inset:0;pointer-events:none;display:none;z-index:2;background:repeating-linear-gradient(105deg,transparent 0 7px,#d6ebff66 7px 8px);background-size:60px 90px;animation:rn .35s linear infinite}
@keyframes rn{to{background-position:-30px 90px}}
#bub{position:fixed;inset:0;pointer-events:none;z-index:3}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:10;padding:14px;touch-action:pan-y}
#mb{background:linear-gradient(180deg,#1a3a4e,#142b3a);border:1px solid #ffffff14;border-radius:22px;padding:20px 18px;width:100%;max-width:440px;max-height:88%;overflow-y:auto}
h2,h3{margin:0 0 10px}h2{font-size:24px}h3{font-size:19px}
p{margin:6px 0}.m{color:var(--mu);font-size:14px}
.sp{background:#fff;color:#102030;border-radius:14px;padding:10px 12px;margin:10px 0}
.you{background:#ffffff18;border-radius:14px;padding:8px 12px;margin:10px 0 0;font-size:14px}
.o{display:block;width:100%;text-align:left;background:#ffffff12;border:1px solid #ffffff22;border-radius:14px;padding:14px;margin:8px 0}
.o.go{background:linear-gradient(180deg,#ffd056,#ffb62e);color:#1a1200;font-weight:800;text-align:center;border:0}
.o.ok{background:#5fd08a28;border-color:var(--ok)}.o.no{background:#ff7a6b28;border-color:var(--no)}
input[type=text]{width:100%;padding:13px;border-radius:12px;border:1px solid #ffffff33;background:#0a1822;color:var(--tx);font-size:17px}
.sw{display:inline-block;width:42px;height:42px;border-radius:50%;margin:4px 6px 4px 0;border:3px solid transparent}
.sw.on{border-color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:5px 0}td:first-child{color:var(--mu);width:42%}
.big{font-size:44px;font-weight:800;color:var(--ac);line-height:1}
</style></head><body>
<canvas id="c"></canvas>
<div id="bub"></div>
<div id="rain"></div>
<div id="hud">
  <div class="chip"><b id="hn"></b><span id="hc"></span><span class="bar"><i id="he"></i></span><span id="nd"></span></div>
  <div class="hud-btns"><button id="phoneBtn" onclick="phone()">📱</button><button id="menuBtn" onclick="menu()">☰</button></div>
</div>
<div id="hint"></div>
<div id="look"></div>
<div id="joy"><div id="knob"></div></div>
<button id="act"></button>
<div id="toast"></div>
<div id="modal"><div id="mb"></div></div>
<script src="01-utils.js"></script>
<script src="02-audio.js"></script>
<script src="03-family.js"></script>
<script src="04-exams.js"></script>
<script src="05-education.js"></script>
<script src="06-school.js"></script>
<script src="07-needs.js"></script>
<script src="08-life.js"></script>
<script src="09-economy.js"></script>
<script src="10-neighbours.js"></script>
<script src="11-menus.js"></script>
<script src="12-world.js"></script>
<script src="13-input.js"></script>
<script src="14-main.js"></script>
</body></html>
