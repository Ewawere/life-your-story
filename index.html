/* ===== sound (audio.js) — free WebAudio, no files ===== */
let AC=null,amb=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')try{AC.resume()}catch(e){}return AC}
function beep(f,d,t,v){if(!AC||(S&&S.muted))return;try{const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t||'sine';o.frequency.value=f;g.gain.value=v||.06;o.connect(g);g.connect(AC.destination);g.gain.setTargetAtTime(0,n+d*.6,d*.15);o.start(n);o.stop(n+d)}catch(e){}}
const SFX={ok:()=>{beep(660,.12);setTimeout(()=>beep(880,.16),110)},bad:()=>beep(180,.25,'square',.04),tap:()=>beep(520,.06),door:()=>{beep(220,.1,'triangle');setTimeout(()=>beep(330,.12,'triangle'),90)},chime:()=>[523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.2),i*110))};
function startAmbient(){if(!AC||amb)return;try{const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5}const src=AC.createBufferSource();src.buffer=b;src.loop=true;const g=AC.createGain();g.gain.value=0;src.connect(g);g.connect(AC.destination);src.start();amb=g}catch(e){}}
addEventListener('pointerdown',()=>{audio();startAmbient()},{once:true});

/* ===== family system (family.js) ===== */
const FN={m:['James','Oliver','Daniel','Mohammed','Arjun','Lucas','Tomasz'],f:['Emma','Sophie','Aisha','Priya','Chloe','Maria','Hannah']},
SUR=['Smith','Taylor','Khan','Patel','Jones','Evans','Brown','Walker'],
JOBS={Low:['shop assistant','bus driver','care worker','security guard','delivery driver'],Middle:['teacher','nurse','civil servant','shop owner','mechanic'],Wealthy:['company director','surgeon','property developer','bank executive']},
TRAITS=['strict','generous','hardworking','easy-going','ambitious','always worried about money','very encouraging'],
EXPECT=['wants you to finish school with strong grades','needs you to help at home and with the family shop','wants you to find your own path'],
HOUSE={Low:'Rented two-room flat',Middle:'Rented three-bedroom flat',Wealthy:'Large family house'};
const CFG={probs:[['Low',.35],['Middle',.45],['Wealthy',.20]]}; // configurable class odds
function genFamily(){
  let r=Math.random(),cls='Wealthy',a=0;for(const [c,p] of CFG.probs){a+=p;if(r<a){cls=c;break}}
  const two=Math.random()<({Low:.5,Middle:.7,Wealthy:.85}[cls]);
  const rg={Low:[14,24],Middle:[30,60],Wealthy:[80,200]}[cls];
  const income=rnd(rg[0],rg[1])*100;
  const spend={Low:[.78,.95],Middle:[.55,.78],Wealthy:[.35,.55]}[cls];
  const expenses=Math.round(income*(spend[0]+Math.random()*(spend[1]-spend[0])));
  const sur=pick(SUR),g=[],jobs=shuf(JOBS[cls]);
  for(let i=0;i<(two?2:1);i++){const sx=Math.random()<.5?'m':'f';g.push({name:pick(FN[sx])+' '+sur,job:jobs[i],trait:pick(TRAITS)})}
  const sibs=[];for(let i=rnd(0,3);i>0;i--)sibs.push({name:pick([...FN.m,...FN.f]),age:rnd(6,24)});
  return{cls,sur,guardians:g,sibs,income,expenses,house:HOUSE[cls],expect:pick(EXPECT),pocket:{Low:20,Middle:50,Wealthy:150}[cls]};
}
function famHTML(){const f=S.fam;
  return `<h3>The ${f.sur} family</h3><table>
  <tr><td>Background</td><td>${f.cls}-income household</td></tr>
  <tr><td>Home</td><td>${f.house}</td></tr><tr><td>Address</td><td>${addr(0,-8)}</td></tr>
  ${f.guardians.map((g,i)=>`<tr><td>Guardian ${i+1}</td><td>${g.name}, ${g.job} (${g.trait})</td></tr>`).join('')}
  <tr><td>Siblings</td><td>${f.sibs.length?f.sibs.map(s=>s.name+' ('+s.age+')').join(', '):'None'}</td></tr>
  <tr><td>Monthly income</td><td>${gbp(f.income)}</td></tr>
  <tr><td>Monthly expenses</td><td>${gbp(f.expenses)}</td></tr>
  <tr><td>Left over</td><td>${gbp(f.income-f.expenses)}</td></tr>
  <tr><td>Expectation</td><td>Family ${f.expect}</td></tr></table>`}

/* ===== question bank (exams.js) — original questions ===== */
const Q=(s,t,d,q,o,a,e)=>({s,t,d,q,o,a,e});
const QB=[

Q('Maths','Algebra',1,'Solve 3x + 4 = 19. What is x?',['3','7','5','15'],2,'Subtract 4: 3x = 15, so x = 5.'),
Q('Maths','Geometry',1,'A rectangle is 8 m by 5 m. What is its area?',['13 m²','26 m²','40 m²','45 m²'],2,'Area = length × width = 8 × 5 = 40.'),
Q('Maths','Number',1,'A notebook costs £3.50. What do 4 notebooks cost?',['£12','£14','£15','£16'],1,'3.50 × 4 = 14.'),
Q('Maths','Geometry',1,'The angles of a triangle add up to…',['90°','270°','180°','360°'],2,'Every triangle has angles totalling 180°.'),
Q('Maths','Number',2,'Next number: 2, 6, 18, 54, ?',['108','162','72','148'],1,'Each term is multiplied by 3. 54 × 3 = 162.'),
Q('Maths','Algebra',2,'Simplify 2(x + 3) − x.',['x + 6','3x + 6','x + 3','2x + 3'],0,'2x + 6 − x = x + 6.'),

Q('Maths','Number',3,'After a 20% discount a phone costs £400. What was the original price?',['£480','£500','£520','£320'],1,'£400 is 80% of the original, so original = 400 ÷ 0.8 = 500.'),
Q('Maths','Algebra',3,'Which values solve x² − 5x + 6 = 0?',['1 and 6','2 and 3','−2 and −3','5 and 6'],1,'Factorise: (x − 2)(x − 3) = 0.'),
Q('Maths','Geometry',3,'A right triangle has shorter sides 6 cm and 8 cm. Its hypotenuse is…',['10 cm','12 cm','14 cm','7 cm'],0,'6² + 8² = 100, and √100 = 10.'),
Q('Maths','Probability',3,'Two fair coins are tossed. The probability of two heads is…',['1/2','1/4','1/3','2/3'],1,'1/2 × 1/2 = 1/4.'),
Q('English','Grammar',1,'Which sentence is correct?',["She don't like rice.","She doesn't like rice.","She not like rice.","She do not likes rice."],1,'With she/he/it we use "doesn\'t" plus the base verb.'),

Q('English','Grammar',1,'A word that describes a noun is called a(n)…',['verb','adverb','adjective','pronoun'],2,'Adjectives describe nouns: a "tall" tree.'),
Q('English','Grammar',1,'What is the plural of "child"?',['childs','childrens','children','childes'],2,'"Child" is irregular: the plural is "children".'),
Q('English','Vocabulary',1,'What is the opposite of "brave"?',['bold','cowardly','strong','loud'],1,'Cowardly means lacking courage.'),
Q('English','Grammar',2,'Choose the correct word: Neither of the boys ___ ready.',['are','were','is','be'],2,'"Neither" is singular, so it takes "is".'),
Q('English','Vocabulary',2,'What is the opposite of "scarce"?',['rare','plentiful','costly','tiny'],1,'Scarce means hard to find. Plentiful means there is a lot.'),
Q('English','Grammar',2,'Name the tense: "By noon, she had finished her work."',['Simple past','Past perfect','Present perfect','Future perfect'],1,'"Had" plus a past participle, about an earlier past moment, is past perfect.'),
Q('English','Vocabulary',2,'"Benevolent" most nearly means…',['cruel','kind and generous','careless','nervous'],1,'Benevolent describes someone who wishes others well.'),
Q('English','Literature',3,'"The market was silent; even the hens seemed to hold their breath." This is…',['simile','personification','alliteration','hyperbole'],1,'The hens are given a human action, which is personification.'),
Q('English','Grammar',3,'Which sentence has a misplaced modifier?',['Ada missed the bus while running down the road.','Running down the road, the bus was missed by Ada.','Ada, running down the road, missed the bus.','While Ada ran down the road, she missed the bus.'],1,'In option B the opening phrase seems to describe the bus, not Ada.'),
Q('English','Comprehension',3,'In "Despite the rain, the match went ahead", "Despite" shows…',['cause','contrast','time','addition'],1,'The match continued even though rain would normally stop it. That is contrast.'),
Q('Science','Biology',1,'Which gas do plants take in for photosynthesis?',['Oxygen','Carbon dioxide','Nitrogen','Hydrogen'],1,'Plants use carbon dioxide, water and light to make food.'),
Q('Science','Chemistry',1,'At sea level, pure water boils at…',['50 °C','150 °C','100 °C','0 °C'],2,'Water boils at 100 °C at sea level.'),
Q('Science','Biology',1,'Which organ pumps blood around the body?',['Lung','Liver','Kidney','Heart'],3,'The heart is a muscle that pumps blood.'),
Q('Science','Physics',1,'Which force pulls objects towards the Earth?',['Friction','Magnetism','Gravity','Tension'],2,"Gravity attracts objects towards Earth's centre."),

Q('Science','Physics',2,'A car travels 150 km in 2 hours. What is its average speed?',['50 km/h','75 km/h','300 km/h','150 km/h'],1,'Speed = distance ÷ time = 150 ÷ 2 = 75.'),
Q('Science','Chemistry',2,'What is the pH of a neutral solution such as pure water?',['0','7','14','10'],1,'pH 7 is neutral. Below 7 is acidic and above 7 is alkaline.'),
Q('Science','Biology',2,'Malaria is spread by which animal?',['Housefly','Female Anopheles mosquito','Tsetse fly','Cockroach'],1,'The parasite is carried by female Anopheles mosquitoes.'),
Q('Science','Biology',3,'Water moving through a semi-permeable membrane from a dilute to a concentrated solution is called…',['Diffusion','Osmosis','Respiration','Evaporation'],1,'That movement of water is osmosis.'),
Q('Science','Physics',3,'A 10 N force moves an object 3 m in its own direction. The work done is…',['13 J','30 J','3.3 J','7 J'],1,'Work = force × distance = 10 × 3 = 30 J.'),

const SUBJ=['Maths','English','Science'];
const grade=p=>p>=83?'A':p>=67?'B':p>=50?'C':p>=33?'D':'F';

// Reusable quiz runner: title, questions, seconds (0 = untimed), show explanations, callback(log)
function quiz(title,qs,secs,explain,done){
  let i=0,t=secs,iv=null,log=[],locked=false;
  const finish=()=>{clearInterval(iv);done(log,qs)};
  const show=()=>{
    const q=qs[i],opts=shuf(q.o.map((x,k)=>({x,k})));locked=false;
    modal(`<h3>${title}</h3><p class="m">Question ${i+1} of ${qs.length} · ${q.s}: ${q.t}${secs?' · <b id="tm">'+t+'s</b> left':''}</p><p style="font-size:18px">${q.q}</p>`+
      opts.map(o=>`<button class="o" data-k="${o.k}">${o.x}</button>`).join(''));
    document.querySelectorAll('#mb .o').forEach(b=>b.onclick=()=>answer(+b.dataset.k,b));
  };
  const next=()=>{i++;if(i>=qs.length)finish();else show()};
  const answer=(k,btn)=>{
    if(locked)return;locked=true;const q=qs[i],ok=k===q.a;(ok?SFX.ok:SFX.bad)();log.push({q:q.q,ok,pick:q.o[k],right:q.o[q.a],e:q.e,s:q.s});
    if(!explain){next();return}
    document.querySelectorAll('#mb .o').forEach(b=>{if(+b.dataset.k===q.a)b.classList.add('ok');else if(b===btn)b.classList.add('no')});
    $('mb').insertAdjacentHTML('beforeend',`<p>${ok?'Correct. ':'Not quite. '}${q.e}</p><button class="o go" id="nx">${i+1<qs.length?'Next question':'Finish'}</button>`);
    $('nx').onclick=next;
  };
  if(secs)iv=setInterval(()=>{t--;const e=$('tm');if(e)e.textContent=t;if(t<=0){while(log.length<qs.length)log.push({q:qs[log.length].q,ok:false,pick:'(no answer)',right:qs[log.length].o[qs[log.length].a],e:qs[log.length].e,s:qs[log.length].s});finish()}},1000);
  show();
}

/* ===== education actions (education.js) ===== */
const lvl=k=>k<35?1:k<70?2:3;
function pickQs(pool,n,l){const seen=S.seen||(S.seen={});return pool.map(q=>[(seen[q.q]?9:0)+Math.abs(q.d-l)*3+Math.random(),q]).sort((a,b)=>a[0]-b[0]).slice(0,n).map(x=>x[1])}
function markSeen(log){S.seen=S.seen||{};log.forEach(l=>S.seen[l.q]=1)}
function deskMenu(){
  modal(`<h3>Study desk</h3><p class="m">Energy ${Math.round(S.energy)}%. Studying costs energy. Pick a subject, or test yourself.</p>`+
    SUBJ.map(s=>`<button class="o" onclick="study('${s}')">Study ${s} <span class="m">· knowledge ${S.know[s]}/100</span></button>`).join('')+
    `<button class="o go" onclick="exam()">Take timed exam (6 questions, 90 s)</button>`,true);
}
function study(sub){
  if(S.energy<15){modal('<h3>Too tired</h3><p>You need to eat or sleep before studying.</p>',true);return}
  const qs=pickQs(QB.filter(q=>q.s===sub),3,lvl(S.know[sub]));
  quiz('Study: '+sub,qs,0,true,log=>{
    const right=log.filter(l=>l.ok).length;markSeen(log);
    S.know[sub]=Math.min(100,S.know[sub]+Math.round((right*4+(3-right))*mm()));S.energy=Math.max(0,S.energy-12);S.t+=45;store();
    modal(`<h3>Session finished</h3><p>${right} of 3 correct. ${sub} knowledge is now ${S.know[sub]}/100.</p><p class="m">Right answers teach you more than wrong ones.</p><button class="o go" onclick="study('${sub}')">Study ${sub} again</button><button class="o" onclick="deskMenu()">Back to desk</button><button class="o" onclick="closeM()">Close</button>`);
  });
}
function exam(){
  if(S.energy<20){modal('<h3>Too tired</h3><p>You need at least 20% energy for an exam.</p>',true);return}
  const qs=shuf(QB).slice(0,6);
  quiz('Mock exam',qs,90,false,log=>{
    const right=log.filter(l=>l.ok).length,pct=Math.round(right/6*100),g=grade(pct);
    S.exams.unshift({pct,g,right,at:Math.floor(S.t)});S.exams=S.exams.slice(0,10);S.energy=Math.max(0,S.energy-15);S.t+=90;store();
    modal(`<p class="m">Mock exam result</p><div class="big">${g}</div><p><b>${right}/6</b> correct (${pct}%)</p>`+
      log.map(l=>`<p><b style="color:${l.ok?'var(--ok)':'var(--no)'}">${l.ok?'Right':'Wrong'}</b> · ${l.q}<br><span class="m">${l.ok?'You answered: '+l.pick:'You answered: '+l.pick+'. Correct: '+l.right+'. '+l.e}</span></p>`).join('')+
      `<button class="o go" onclick="exam()">Try another exam</button><button class="o" onclick="closeM()">Close</button>`);
  });
}

/* ===== school + university (education.js) ===== */
const TT=['Maths','English','Science','Maths','English'],DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const day=()=>Math.floor(S.t/1440),hr=()=>(S.t%1440)/60;
function schoolMenu(){

function topic(id,k){

  if(k==='advice'&&r.f<20){talk(id,`${n.name}: "We don't know each other well enough for that yet."`,YOU[k]);return}
  const tier=r.f<20?0:r.f<40?1:2;let g=T[1]*(1-r.f/150)*mm(),res;
  if(k==='gift'){S.cash-=3;g+=2}
  if(k==='advice'){const b=weakest();S.know[b]=Math.min(100,S.know[b]+1);res=`${pick(INTRO[tier])} ${ADV[b]} (${b} +1)`;r.m=''}
  else if(n.likes===k){g+=2;res=`${pick(INTRO[tier])} ${pick(LINES[k])} ${pick(LIKE)}`;r.m='like'}
  else if(n.dis===k){g=-1;res=`... ${pick(DIS)}`;r.m='dis'}
  else{res=`${pick(INTRO[tier])} ${pick(LINES[k])}`;r.m=''}

  r.f=Math.max(0,Math.min(100,r.f+g));r.d[k]=day();gain('social',8);S.t+=10;S.energy=Math.max(0,S.energy-1);store();

}
