<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Life: Your Story — Lego Style</title>
<style>html,body{margin:0;height:100%;background:#0e2230;color:#fff;font:16px system-ui}
#b{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}</style></head>
<body><div id="b">Loading Lego Style…</div>
<script>
(async()=>{
  const el=document.getElementById('b');
  try{
    let b64='';
    const N=31;
    const v='v2'; // cache bust
    for(let i=0;i<N;i++){
      const r=await fetch('e'+i+'.txt?'+v,{cache:'no-store'});
      if(!r.ok) throw new Error('part '+i+' ('+r.status+')');
      b64+=(await r.text()).replace(/\s+/g,'');
      el.textContent='Loading Lego Style '+(i+1)+'/'+N;
    }
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const ds=new DecompressionStream('gzip');
    const stream=new Blob([bin]).stream().pipeThrough(ds);
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){
    el.innerHTML='Failed to load: '+e.message+'<br><br><button onclick="location.reload()" style="padding:10px 16px;font-size:16px">Retry</button>';
    console.error(e);
  }
})();
</script></body></html>
