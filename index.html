<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life: Your Story — Loading</title>
<style>
html,body{margin:0;height:100%;background:#0e2230;color:#f2f6f8;font:16px/1.4 system-ui,sans-serif}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:12px}
#log{max-width:360px;text-align:left;font-size:13px;color:#9fb7c4;white-space:pre-wrap;word-break:break-word}
.err{color:#ff7a6b}
</style></head><body>
<div id="boot">
  <h2 style="margin:0">Life: Your Story</h2>
  <div id="status">Starting…</div>
  <div id="log"></div>
</div>
<script>
const log=(m,err)=>{
  const el=document.getElementById('log');
  el.innerHTML+=(err?'<span class="err">':'')+m+(err?'</span>':'')+'\n';
  document.getElementById('status').textContent=m;
  console.log(m);
};
function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=src;
    s.onload=()=>{log('OK '+src);res()};
    s.onerror=()=>{log('FAIL '+src,true);rej(new Error(src))};
    document.body.appendChild(s);
  });
}
async function loadB64(name,n){
  log('Loading '+name+' ('+n+' parts)…');
  let b='';
  for(let i=0;i<n;i++){
    const r=await fetch(name+'.p'+i+'.txt');
    if(!r.ok) throw new Error(name+'.p'+i+' HTTP '+r.status);
    b+=await r.text();
  }
  const code=atob(b);
  const s=document.createElement('script');
  s.textContent=code;
  document.body.appendChild(s);
  log('OK '+name+' ('+code.length+' bytes)');
}
(async()=>{
  try{
    // Build minimal DOM the game expects
    const need=['c','hud','hn','hc','he','nd','phoneBtn','menuBtn','rain','bub','hint','look','joy','knob','act','toast','modal','mb'];
    need.forEach(id=>{if(!document.getElementById(id)){const d=document.createElement(id==='c'?'canvas':'div');d.id=id;d.style.display='none';document.body.appendChild(d)}});
    const c=document.getElementById('c');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;display:block';
    document.getElementById('modal').style.cssText='position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:10;padding:14px';
    document.getElementById('mb').style.cssText='background:#16384c;border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:88%;overflow-y:auto';
    document.getElementById('toast').style.cssText='position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#000b;padding:10px 16px;border-radius:12px;display:none;z-index:20';
    document.getElementById('joy').style.cssText='position:fixed;left:22px;bottom:30px;width:120px;height:120px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff44;display:none';
    document.getElementById('knob').style.cssText='position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#ffffffaa';
    document.getElementById('act').style.cssText='position:fixed;right:20px;bottom:40px;display:none;background:#ffb62e;color:#1a1200;border:0;border-radius:16px;padding:16px 20px;font-weight:700';
    document.getElementById('hud').style.cssText='position:fixed;left:0;right:0;top:0;display:none;justify-content:space-between;padding:10px 12px';

    await loadScript('renderer-2d.js');
    await loadScript('s1.js');
    await loadScript('s2.js');
    await loadScript('s3.js');
    await loadScript('s4.js');
    await loadB64('s5',8);
    await loadScript('s6.js');
    await loadScript('s7.js');
    await loadScript('s8.js');
    await loadB64('s9',8);
    await loadB64('s10',8);
    await loadScript('s11.js');
    await loadB64('s12',7);
    await loadB64('s13',7);
    await loadB64('s14',8);
    await loadScript('s15.js');
    await loadScript('screen-2d.js');
    document.getElementById('boot').style.display='none';
    log('All modules loaded');
  }catch(e){
    log('ERROR: '+e.message,true);
    console.error(e);
  }
})();
</script>
</body></html>
